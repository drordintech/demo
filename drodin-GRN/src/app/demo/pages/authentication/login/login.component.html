<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="card my-5">
        <div class="card-body">
          <a href="#" class="d-flex justify-content-center">
            <img width="250" src="assets/images/authentication/square-logo-black-full.png" />
          </a>
          <div class="row">
            <div class="d-flex justify-content-center">
              <div class="auth-header">
                <h2 class="text-secondary mt-2"><b>Hi, Welcome Back</b></h2>
                <p class="fs-4">Enter your credentials to continue</p>
              </div>
            </div>
          </div>
          
          <div class="form-floating mb-3">
            <input
              type="email"
              class="form-control"
              id="floatingInput"
              [(ngModel)]="email"
              placeholder="Email address"
            />
            <label for="floatingInput">Email address / Username</label>
          </div>
          <!-- Password Input -->
          <div class="form-floating mb-3">
            <input
              type="password"
              class="form-control"
              id="password"
              [(ngModel)]="password"
              placeholder="Password"
            />
            <label for="password">Password</label>
          </div>
          <div class="d-flex mt-1 justify-content-between">
            <div class="form-check">
              <input class="form-check-input input-primary" type="checkbox" id="customCheckc1" checked="" />
              <label class="form-check-label text-muted" for="customCheckc1">Remember me</label>
            </div>
            <!-- <h5 class="text-secondary">
              <a href="javascript:">Forgot Password?</a>
            </h5> -->
          </div>
          <!-- Login Button -->
          <div class="d-grid mt-4">
            <button type="button" class="btn btn-secondary" (click)="onLogin()">Sign In</button>
          </div>

          <div class="form-group">
            @if (isLoginFailed) {
            <div class="alert alert-danger" role="alert">
              Login failed: {{ errorMessage }}
            </div>
            }
        </div>
          <!-- <hr /> -->
          <!-- <h5 class="d-flex justify-content-center">
            <a [routerLink]="['/guest/register']">Don't have an account?</a>
          </h5> -->
        </div>
      </div>
    </div>
  </div>
</div>
