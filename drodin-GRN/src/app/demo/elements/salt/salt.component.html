<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-body">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">API List</h5>
            <button class="btn btn-primary" (click)="openAddSaltModal()">
              <i class="bi bi-plus"></i> Add API
            </button>
          </div>
          <hr />
          <div class="table-responsive" style="max-height: 400px; overflow: auto;">
            <table class="table table-bordered table-hover text-start">
              <thead class="table-dark">
                <tr>
                  <th scope="col">Name
                    <span class="filter-icon" (click)="toggleFilter('name')">
                      <i class="bi bi-filter"></i>
                    </span>
                    <div *ngIf="activeFilter === 'name'" class="filter-popup">
                      <input type="text" class="form-control form-control-sm" placeholder="Filter Name"
                        [(ngModel)]="filters.name" />
                    </div>
                  </th>
                  <th scope="col" class="actions-column">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let salt of filteredSalt(); let i = index">
                  <td>{{ salt.name }}</td>
                  
                  <td class="actions-column">
                    <button class="btn btn-sm hover-text" (click)="editSalt(salt)">
                      <i class="bi bi-pencil"></i>
                      <span class="tooltip-text">Edit</span>
                    </button>
                    <button class="btn btn-sm hover-text" (click)="deleteSalt(salt.saltId)">
                      <i class="bi bi-trash"></i>
                      <span class="tooltip-text">Delete</span>
                    </button>
                    <button class="btn btn-sm hover-text" (click)="linkMenufacturer(salt.saltId)">
                      <i class="bi bi-link"></i>
                      <span class="tooltip-text">Link API with Menufacturer</span>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>




        </div>
        <hr />
        
        
        <!-- Add/Edit SALT Modal -->
        <div class="modal fade" id="addSaltModal" tabindex="-1" aria-labelledby="addSaltModalLabel"
          aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="addSaltModalLabel">
                  {{ editingsalt ? 'Edit API' : 'Add API' }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form #saltForm="ngForm" (submit)="editingsalt ? updateSalt() : addSalt()">
                  <div class="mb-3">
                    <label for="name" class="form-label">Name <span class="text-danger">*</span></label>
                    <input id="name" [(ngModel)]="tempSaltName" name="name"
                      class="form-control" placeholder="API Name" required  #name="ngModel" />
                      <div *ngIf="name.invalid && name.touched" class="text-danger">
                        <small>API Name is required.</small>
                      </div>
                  </div>
              
                  <button type="submit" [disabled]="saltForm.invalid" class="btn btn-primary">{{ editingsalt ?  'Update API' : 'Save
                    API' }}</button>
                </form>
              </div>
            </div>
          </div>
        </div>


        <!-- Link Manufacturer Modal -->
        <div class="modal fade" id="linkManufacturerModal" tabindex="-1" aria-labelledby="linkManufacturerModalLabel"
          aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="linkManufacturerModalLabel">Link Manufacturer with API</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <!-- Add your form or content here -->
                <div class="mb-3">
                  <label for="ManufacturerInfo" class="form-label">Manufacturer Information</label>
                  <select id="manufacturerDropdown" [(ngModel)]="selectedMenufacturer" name="manufacturerDropdown" class="form-control custom-dropdown">
                    <option value="" disabled>Select Manufacturer</option>
                    <option *ngFor="let manufacturer of manufacturers" [value]="manufacturer.manufacturerId">{{ manufacturer.name }}</option>
                  </select>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" (click)="saveLinkManufacturer()">Save</button>
              </div>
            </div>
          </div>
        </div>


      </div>
    </div>
  </div>
</div>
